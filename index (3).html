<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un puzzle pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fraunces:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4fa0;--pink2:#ff8ac4;--fg:#ffe6f2;--mut:#b98aa3;--card:#150c12;--line:#4a1d36;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:17px/1.55 'Fraunces',Georgia,serif;overflow-x:hidden;
 background:radial-gradient(900px 600px at 15% 0%,rgba(255,79,160,.2),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,40,90,.15),transparent 60%),#09060a}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:1.6rem 1rem 3rem;text-align:center}
h1{font:400 3.1rem/1.1 'Great Vibes',cursive;color:var(--pink);margin:.3rem 0 .1rem;text-shadow:0 0 22px rgba(255,79,160,.6)}
.c{color:var(--mut);font-style:italic;margin:.2rem 0 1rem}
.stage{perspective:1100px;padding:.6rem 0}
.frame{position:relative;width:min(90vw,500px);margin:0 auto;background:#120a10;padding:14px 14px 62px;border-radius:4px;transform:rotate(-1deg);transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 1px rgba(255,79,160,.55),0 0 46px rgba(255,79,160,.28),0 34px 60px rgba(0,0,0,.75)}
.frame::before,.frame::after{content:"";position:absolute;top:-13px;width:82px;height:25px;background:rgba(255,79,160,.5);box-shadow:0 0 12px rgba(255,79,160,.4)}
.frame::before{left:-18px;transform:rotate(-38deg)}.frame::after{right:-18px;transform:rotate(38deg)}
.cap{position:absolute;left:0;right:0;bottom:12px;font:400 2rem 'Great Vibes',cursive;color:var(--pink2)}
.board{position:relative;width:100%;background:#000;overflow:hidden;filter:blur(14px);transition:filter 1.2s ease}
.board.clear{filter:none}
.pc{position:absolute;left:0;top:0;transition:transform .6s cubic-bezier(.2,1.1,.3,1);touch-action:none;cursor:grab;user-select:none}
.pc.drag{transition:none;z-index:20;cursor:grabbing}
.f{position:absolute;inset:1.5px;border-radius:5px;background-image:var(--img);transition:inset .7s,border-radius .7s,transform .18s,box-shadow .2s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),inset 0 -2px 3px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.6)}
.solved .f{inset:0;border-radius:0;box-shadow:none}
.pc.drag .f{box-shadow:0 18px 32px rgba(0,0,0,.7),0 0 18px rgba(255,79,160,.5);transform:scale(1.1)}
.pc.hot .f{box-shadow:0 0 0 3px var(--pink),0 0 20px rgba(255,79,160,.7)}
.f.sel{transform:scale(.93);box-shadow:0 0 0 3px var(--pink)}
.f.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.12)}}
.bar{width:min(90vw,500px);height:8px;margin:1.2rem auto .3rem;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),#ff2e4d);box-shadow:0 0 12px var(--pink);transition:width .5s}
.letter{max-width:500px;margin:1.8rem auto 0;padding:1.6rem 1.5rem;background:rgba(21,12,18,.88);border:1px solid rgba(255,79,160,.5);border-radius:6px;box-shadow:0 0 36px rgba(255,79,160,.22);font:400 2.15rem/1.45 'Great Vibes',cursive;color:#ffd3e8;text-align:left;white-space:pre-wrap;min-height:5rem;opacity:0;transform:translateY(20px);transition:all 1s cubic-bezier(.2,.8,.2,1)}
.letter.show{opacity:1;transform:none}
.ch{animation:ink .6s both}@keyframes ink{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
.quill{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.2em;transform-origin:0 100%;animation:wr .3s ease-in-out infinite alternate;transition:opacity 1s}
@keyframes wr{from{transform:rotate(-6deg)}to{transform:rotate(7deg) translateY(-2px)}}
.btn,.pick{font:600 1.05rem 'Fraunces',serif;padding:.85rem 1.6rem;border:0;border-radius:999px;background:linear-gradient(135deg,#ff4fa0,#ff2e6e);color:#fff;cursor:pointer;box-shadow:0 0 26px rgba(255,79,160,.5);transition:transform .15s,box-shadow .15s}
.btn:hover,.pick:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(255,79,160,.75)}
.btn.alt{background:transparent;border:1.5px solid var(--pink);color:var(--pink2);box-shadow:none}
.card{background:rgba(21,12,18,.88);border:1px solid rgba(255,79,160,.45);border-radius:14px;padding:1.3rem;box-shadow:0 0 40px rgba(255,79,160,.18);display:grid;gap:1rem;text-align:left}
textarea{font:italic 1.05rem/1.5 'Fraunces',serif;padding:.8rem;border:1px solid var(--line);border-radius:10px;background:#0d070b;color:var(--fg);width:100%;resize:vertical}
.chips{display:flex;gap:.6rem;margin-top:.3rem}.chips input{display:none}
.chips span{display:inline-block;padding:.4rem 1.1rem;border:1.5px solid var(--line);border-radius:999px;cursor:pointer}
.chips input:checked+span{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 0 14px rgba(255,79,160,.6)}
.prev{max-height:170px;max-width:100%;justify-self:center;border:5px solid #120a10;outline:1px solid var(--pink);transform:rotate(2deg)}
.conf{position:fixed;top:-20px;width:10px;height:16px;animation:fall linear forwards;pointer-events:none;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
small{color:var(--mut)}
</style></head>
<body><div id="app"></div>
<script id="data" type="application/json">null</script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a)e[x]=a[x];e.append(...k);return e};
const unsafe=s=>s.replace(/-/g,'+').replace(/_/g,'/'),safe=s=>s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
/* Cœurs rouges flottants en WebGL2 (instanciés, avec rotation 3D et parallaxe) */
(function(){
 const VS=`#version 300 es
 in vec2 q;in vec4 a;uniform float t,asp;uniform vec2 m;out vec2 uv;out float dep;
 void main(){float y=mod(a.y*t+a.w*2.6,2.6)-1.3,x=a.x+sin(t*.5+a.w*6.28)*.07,s=cos(t*(.5+a.w)+a.w*20.),g=sin(t*.7+a.w*9.)*.4;
  vec2 p=q*a.z;p.x*=s;p=mat2(cos(g),sin(g),-sin(g),cos(g))*p;p.x/=asp;
  gl_Position=vec4(vec2(x,y)+m*a.z*.8+p,0.,1.);uv=q;dep=abs(s);}`;
 const FS=`#version 300 es
 precision highp float;in vec2 uv;in float dep;out vec4 o;
 void main(){vec2 p=uv*1.25;p.y+=.12;float f=pow(p.x*p.x+p.y*p.y-1.,3.)-p.x*p.x*p.y*p.y*p.y;
  float aa=fwidth(f)*1.2,m=smoothstep(aa,-aa,f);if(m<.01)discard;
  float hg=clamp(-f*5.,0.,1.);vec3 c=mix(vec3(.5,0.,.05),vec3(1.,.1,.18),hg);
  c+=pow(max(0.,1.-length(p-vec2(-.4,.45))*1.7),3.)*.75*dep;c*=.5+.5*dep;o=vec4(c*m,m)*.88;}`;
 const cv=h('canvas',{id:'gl'});document.body.prepend(cv);
 const gl=cv.getContext('webgl2',{premultipliedAlpha:true});if(!gl)return cv.remove();
 const pr=gl.createProgram();[[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,FS]].forEach(([t,s])=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);gl.attachShader(pr,o)});
 gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return cv.remove();gl.useProgram(pr);
 const bind=(data,name,sz,div)=>{gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
  const l=gl.getAttribLocation(pr,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,sz,gl.FLOAT,false,0,0);gl.vertexAttribDivisor(l,div)};
 const M=46,inst=new Float32Array(M*4);for(let i=0;i<M;i++)inst.set([Math.random()*2-1,.05+Math.random()*.11,.05+Math.random()*.12,Math.random()],i*4);
 bind(new Float32Array([-1,-1,1,-1,-1,1,1,1]),'q',2,0);bind(inst,'a',4,1);
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
 const U=n=>gl.getUniformLocation(pr,n);let mx=0,my=0;
 addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=.5-e.clientY/innerHeight});
 const fit=()=>{const r=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*r;cv.height=innerHeight*r;gl.viewport(0,0,cv.width,cv.height);gl.uniform1f(U('asp'),cv.width/cv.height)};
 addEventListener('resize',fit);fit();const t0=performance.now();
 (function f(){gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(U('t'),(performance.now()-t0)/1000);gl.uniform2f(U('m'),mx,my);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,M);requestAnimationFrame(f)})();
})();
function load(){
 try{const d=JSON.parse($('#data').textContent);if(d)return d}catch(e){}
 try{const q=new URLSearchParams(location.hash.slice(1));if(q.get('i'))return{n:+q.get('n'),w:+q.get('w'),h:+q.get('h'),msg:q.get('m')||'',img:'data:image/jpeg;base64,'+unsafe(q.get('i'))}}catch(e){}
 return null}
function confetti(k=70){const cols=['#ff4fa0','#ff8ac4','#ff2e4d','#ffffff','#ffd1e6'];
 for(let i=0;i<k;i++){const s=h('i',{className:'conf'});s.style.left=Math.random()*100+'vw';s.style.background=cols[i%5];
  s.style.animationDuration=2.5+Math.random()*2.5+'s';s.style.animationDelay=Math.random()*1.2+'s';s.style.borderRadius=i%3?'2px':'50%';
  document.body.append(s);setTimeout(()=>s.remove(),7000)}}
const FEATHER='<svg viewBox="0 0 24 24" width="100%" height="100%"><defs><linearGradient id="fg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff8ac4"/><stop offset="1" stop-color="#ff2e6e"/></linearGradient></defs><path d="M2 22C5 14 11 6 22 2C21 11 15 18 8 19L2 22Z" fill="url(#fg)"/><path d="M2 22L15 9" stroke="#fff" stroke-opacity=".7" stroke-width=".8" fill="none"/></svg>';
function quill(el,t){const ink=h('span'),q=h('span',{className:'quill',innerHTML:FEATHER}),k=Math.min(1,500/Math.max(1,t.length));let i=0;
 el.replaceChildren(ink,q);
 (function step(){if(i>=t.length){setTimeout(()=>q.style.opacity=0,1500);return}
  const c=t[i++];ink.append(h('span',{className:'ch'},c));
  const d=/[.!?]/.test(c)?420:/[,;:]/.test(c)?220:c==='\n'?350:45+Math.random()*60;setTimeout(step,Math.max(14,d*k))})()}
function play(p){
 const n=p.n,N=n*n,pcs=[];let order=[...Array(N).keys()],sel=-1,state='intro',drag=null;
 const frame=h('div',{className:'frame'}),board=h('div',{className:'board solved'}),cap=h('div',{className:'cap'},'Quelqu’un a pensé à toi…'),
 go=h('button',{className:'btn'},'Commencer'),hint=h('p',{className:'c'},'Une surprise t’attend, cachée dans cette photo.'),
 bar=h('i'),prog=h('div',{className:'bar',hidden:true},bar),letter=h('div',{className:'letter'});
 board.style.aspectRatio=p.w+'/'+p.h;board.style.setProperty('--img','url('+p.img+')');
 const pos=(el,i)=>el.style.transform='translate('+(i%n)*100+'%,'+Math.floor(i/n)*100+'%)';
 for(let pc=0;pc<N;pc++){const el=h('div',{className:'pc'}),f=h('div',{className:'f'});
  el.style.width=el.style.height=100/n+'%';el.dataset.pc=pc;
  f.style.backgroundSize=n*100+'% '+n*100+'%';f.style.backgroundPosition=(pc%n)/(n-1)*100+'% '+Math.floor(pc/n)/(n-1)*100+'%';
  el.append(f);pcs[pc]=el;board.append(el)}
 function layout(stag){let ok=0;order.forEach((pc,i)=>{const el=pcs[pc];el.style.transitionDelay=stag?Math.random()*.35+'s':'0s';pos(el,i);if(pc===i)ok++});
  bar.style.width=ok/N*100+'%';return ok}
 const mark=()=>pcs.forEach((el,pc)=>el.firstChild.classList.toggle('sel',sel>=0&&order[sel]===pc));
 const slotAt=(x,y)=>{const r=board.getBoundingClientRect();return Math.min(n-1,Math.max(0,Math.floor((y-r.top)/r.height*n)))*n+Math.min(n-1,Math.max(0,Math.floor((x-r.left)/r.width*n)))};
 function swap(i,j){[order[i],order[j]]=[order[j],order[i]];sel=-1;mark();const ok=layout();
  [i,j].forEach(k=>{if(order[k]===k){const f=pcs[k].firstChild;f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop')}});
  if(ok===N)win()}
 function win(){state='done';board.classList.add('solved');cap.textContent='Pour toi, avec tout mon cœur';hint.textContent='Bravo, tu as reconstitué la photo !';confetti();
  setTimeout(()=>{letter.classList.add('show');letter.scrollIntoView({behavior:'smooth',block:'center'});quill(letter,p.msg)},1200)}
 go.onclick=()=>{go.hidden=true;board.classList.add('clear');cap.textContent='Regarde-la bien…';hint.textContent='Elle va se défaire dans un instant.';
  setTimeout(()=>{do{order.sort(()=>Math.random()-.5)}while(order.every((v,i)=>v===i));
   board.classList.remove('solved');layout(true);state='play';frame.style.transform='rotate(-1deg)';
   cap.textContent='À toi de jouer';hint.textContent='Glisse une pièce sur une autre pour les échanger.';prog.hidden=false},2200)};
 board.onpointerdown=e=>{const el=e.target.closest('.pc');if(!el||state!=='play')return;
  drag={pc:+el.dataset.pc,el,slot:order.indexOf(+el.dataset.pc),x:e.clientX,y:e.clientY,m:false};el.setPointerCapture(e.pointerId)};
 board.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,d=drag;
  if(!d.m&&Math.hypot(dx,dy)>6){d.m=true;d.el.classList.add('drag')}
  if(!d.m)return;
  d.el.style.transitionDelay='0s';d.el.style.transform='translate(calc('+(d.slot%n)*100+'% + '+dx+'px),calc('+Math.floor(d.slot/n)*100+'% + '+dy+'px))';
  d.el.firstChild.style.transform='rotate('+Math.max(-10,Math.min(10,e.movementX*.9))+'deg) scale(1.1)';
  pcs.forEach(q=>q.classList.remove('hot'));const t=slotAt(e.clientX,e.clientY);if(t!==d.slot)pcs[order[t]].classList.add('hot')};
 board.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;d.el.classList.remove('drag');d.el.firstChild.style.transform='';pcs.forEach(q=>q.classList.remove('hot'));
  if(d.m){const t=slotAt(e.clientX,e.clientY);if(t!==d.slot)swap(d.slot,t);else layout()}
  else if(sel<0){sel=d.slot;mark()}else if(sel===d.slot){sel=-1;mark()}else swap(sel,d.slot)};
 board.onpointercancel=()=>{drag=null;pcs.forEach(q=>q.classList.remove('drag','hot'));layout()};
 addEventListener('pointermove',e=>{if(state==='play'||e.pointerType==='touch')return;
  frame.style.transform='rotateX('+(.5-e.clientY/innerHeight)*9+'deg) rotateY('+(e.clientX/innerWidth-.5)*13+'deg) rotate(-1deg)'});
 frame.append(board,cap);
 app.append(h('h1',{},'Un petit cadeau pour toi'),hint,h('div',{className:'stage'},frame),go,prog,letter);layout()}
function shrink(bmp,max,q){const k=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),hh=Math.round(bmp.height*k),c=h('canvas',{width:w,height:hh});
 c.getContext('2d').drawImage(bmp,0,0,w,hh);return{w,h:hh,img:c.toDataURL('image/jpeg',q)}}
function create(){
 const f=h('input',{type:'file',accept:'image/*',hidden:true}),prev=h('img',{className:'prev',hidden:true}),
 pick=h('button',{className:'pick',type:'button'},'Choisir une photo'),
 t=h('textarea',{rows:5,maxLength:1200,placeholder:'Écris ton mot caché ici… il s’écrira à la plume quand le puzzle sera terminé.'}),
 chips=h('div',{className:'chips'},...[5,6].map(v=>h('label',{},h('input',{type:'radio',name:'g',value:v,checked:v===5}),h('span',{},v+' × '+v)))),
 dl=h('button',{className:'btn'},'Télécharger le puzzle (fichier)'),lk=h('button',{className:'btn alt'},'Copier un lien direct'),st=h('small',{});
 pick.onclick=()=>f.click();f.onchange=()=>{if(f.files[0]){prev.src=URL.createObjectURL(f.files[0]);prev.hidden=false;pick.textContent='Changer la photo'}};
 const n=()=>+document.querySelector('input[name=g]:checked').value;
 async function ready(){if(!f.files[0]||!t.value.trim()){st.textContent='Choisis une photo et écris un mot.';return null}
  try{return await createImageBitmap(f.files[0])}catch(e){st.textContent='Cette photo ne peut pas être lue (essaie un JPG ou un PNG).';return null}}
 dl.onclick=async()=>{const b=await ready();if(!b)return;const s=shrink(b,1000,.8);
  const c=document.documentElement.cloneNode(true);c.querySelector('#app').replaceChildren();const g=c.querySelector('#gl');if(g)g.remove();
  c.querySelector('#data').textContent=JSON.stringify({n:n(),w:s.w,h:s.h,img:s.img,msg:t.value.trim()}).replace(/</g,'\\u003c');
  h('a',{href:URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'})),download:'puzzle-'+Date.now().toString(36)+'.html'}).click();
  st.textContent='Fichier téléchargé : mets-le sur GitHub à côté de celui-ci, puis partage son lien.'};
 lk.onclick=async()=>{const b=await ready();if(!b)return;const s=shrink(b,460,.55);
  const url=location.href.split('#')[0]+'#'+new URLSearchParams({n:n(),w:s.w,h:s.h,m:t.value.trim(),i:safe(s.img.split(',')[1])});
  try{await navigator.clipboard.writeText(url);st.textContent='Lien copié ('+Math.round(url.length/1000)+' Ko). Il est long : le fichier est plus sûr pour l’envoyer.'}catch(e){st.textContent='Copie impossible ici.'}};
 app.append(h('h1',{},'Crée ton puzzle'),h('p',{className:'c'},'Une photo, un mot caché, et un lien à offrir.'),
  h('div',{className:'card'},f,pick,prev,t,h('div',{},h('small',{},'Nombre de pièces'),chips),dl,lk,st))}
const P=load();P?play(P):create();
</script></body></html>
